<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>ナンプレ</title>
  <meta name="theme-color" content="#f6f3ee">
  <!-- iPhone でホーム画面に追加したときの設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ナンプレ">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <select id="difficulty" aria-label="難易度">
        <option value="easy">かんたん</option>
        <option value="normal">ふつう</option>
        <option value="hard">むずかしい</option>
        <option value="expert">超むずかしい</option>
        <option value="extreme">エクストリーム</option>
      </select>
      <div class="status">
        <span id="mistakes">ミス 0</span>
        <span id="timer">00:00</span>
      </div>
      <button id="newGame" class="btn-text">新しい問題</button>
    </header>

    <div id="board" class="board" role="grid" aria-label="ナンプレ盤面"></div>

    <div class="tools">
      <button id="undo" class="tool"><span class="icon">↶</span>戻す</button>
      <button id="erase" class="tool"><span class="icon">⌫</span>消す</button>
      <button id="memo" class="tool"><span class="icon">✎</span>メモ<span id="memoState" class="badge">OFF</span></button>
      <button id="hint" class="tool"><span class="icon">💡</span>ヒント</button>
    </div>

    <div id="pad" class="pad"></div>
  </main>

  <div id="loading" class="overlay loading" hidden>
    <div class="dialog">
      <div class="spinner"></div>
      <p>問題を作成中…</p>
    </div>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div class="dialog">
      <h2 id="dialogTitle">クリア！</h2>
      <p id="dialogBody"></p>
      <button id="dialogBtn" class="btn-primary">次の問題へ</button>
    </div>
  </div>

  <script src="sudoku.js"></script>
  <script src="app.js"></script>
</body>
</html>
